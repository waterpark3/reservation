<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexicon 入場者管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#fff; --text:#111; --sub:#666; --line:#d9d9d9; --soft:#f5f5f5;
  --ink:#111; --ok:#1b6e3c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
main{max-width:640px; margin:0 auto; padding:12px 12px 96px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
.btn{
  border:1px solid #aaa; background:var(--bg); color:var(--text);
  padding:9px 14px; border-radius:6px; font-size:14px; cursor:pointer;
}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn:focus, .btn:focus-visible{outline:1px solid var(--line); outline-offset:1px;}
.btn:disabled{opacity:.5;}
input[type=file]{display:none;}
.tabs{display:flex; gap:6px; overflow-x:auto; margin:14px 0 10px; padding-bottom:2px;}
.tab{
  flex:0 0 auto; padding:7px 12px; border-radius:6px; font-size:13px;
  border:1px solid var(--line); background:var(--bg); color:var(--sub); white-space:nowrap; cursor:pointer;
}
.tab.active{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.card{border:1px solid var(--line); border-radius:6px; padding:10px 12px;}
.card .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
.card .label{font-size:12px; color:var(--sub); margin-top:2px;}
.card.enter .num{color:var(--ok);}
section.block{border:1px solid var(--line); border-radius:6px; margin-bottom:14px; overflow:hidden;}
.block h2{font-size:13px; margin:0; padding:8px 12px; background:var(--soft); border-bottom:1px solid var(--line); color:var(--sub); font-weight:600;}
.guest{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line);}
.guest:last-child{border-bottom:none;}
.guest .info{flex:1; min-width:0;}
.guest .name{font-size:15px;}
.guest .sub{font-size:12px; color:var(--sub);}
.badge{font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--sub); margin-left:6px;}
.guest.complete{background:var(--soft);}
.guest.complete .name{color:var(--sub);}
.memo-btn{
  display:block; max-width:100%; margin-top:2px; padding:4px 0;
  border:none; background:none;
  color:var(--sub); font:inherit; font-size:12px; text-align:left; cursor:pointer;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.memo-btn.has{color:var(--text);}
.gthumbs{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px;}
.gthumbs img{width:40px; height:40px; object-fit:cover; border-radius:4px; display:block; cursor:pointer;}
.thumbs{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 8px;}
.thumbs:empty{display:none;}
.thumb{position:relative; width:76px; height:76px;}
.thumb img{width:100%; height:100%; object-fit:cover; border-radius:6px; display:block; cursor:pointer;}
.thumb .rm{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:none; background:var(--ink); color:#fff; font-size:14px; line-height:1; cursor:pointer;}
#imgView{width:100%; height:auto; max-height:75vh; object-fit:contain; display:block;}
.stepper{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.stepper button{
  width:32px; height:32px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:16px; line-height:1; cursor:pointer;
}
.stepper button:disabled{opacity:.3;}
.stepper .count{min-width:44px; text-align:center; font-size:14px; font-variant-numeric:tabular-nums;}
.stepper .count b{color:var(--ok);}
.check{display:flex; align-items:center; gap:8px; flex:0 0 auto; padding:6px 4px; font-size:14px; cursor:pointer;}
.check input{width:26px; height:26px; margin:0; accent-color:var(--ok); cursor:pointer;}
.del{flex:0 0 auto; border:1px solid var(--line); background:var(--bg); color:#b3261e; border-radius:6px; padding:6px 8px; font-size:12px; cursor:pointer;}
.empty{padding:14px 12px; color:var(--sub); font-size:13px;}
.walkincount{display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 12px;}
.walkincount button{
  width:46px; height:46px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:22px; line-height:1; cursor:pointer;
}
.walkincount button:disabled{opacity:.3;}
.walkincount .num{min-width:64px; text-align:center; font-size:30px; font-weight:700; font-variant-numeric:tabular-nums;}
#qrArea{display:flex; justify-content:center; margin:6px 0 4px;}
#qrArea img, #qrArea canvas{width:220px; height:220px;}
.fab-area{
  position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg); border-top:1px solid var(--line);
}
.fab-area .btn{flex:1;}
dialog{border:none; border-radius:8px; padding:0; max-width:420px; width:92vw; background:var(--bg); color:var(--text);}
dialog::backdrop{background:rgba(0,0,0,.4);}
.dform{padding:18px;}
.dform h3{margin:0 0 12px; font-size:16px; overflow-wrap:anywhere;}
.dform label{display:block; font-size:12px; color:var(--sub); margin:10px 0 4px;}
.dform input, .dform select, .dform textarea{
  width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:15px; font-family:inherit;
}
.dform textarea{resize:vertical; min-height:110px;}
.dform .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.status{font-size:12px; color:var(--sub); text-align:center; margin-top:8px;}
</style>
</head>
<body>
<main>
  <div class="row">
    <button class="btn" id="importBtn">予約リストをインポート</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>
  <div class="status" id="importStatus"></div>

  <div class="tabs" id="tabs"></div>

  <div class="cards">
    <div class="card enter"><div class="num" id="enteredNum">0</div><div class="label">入場した人数</div></div>
    <div class="card wait"><div class="num" id="waitingNum">0</div><div class="label">未入場（予約あり）</div></div>
  </div>

  <section class="block">
    <h2>当日受付人数</h2>
    <div class="walkincount">
      <button type="button" id="wDec">−</button>
      <div class="num" id="wCountNum">0</div>
      <button type="button" id="wInc">＋</button>
    </div>
  </section>

  <section class="block">
    <h2>予約者一覧</h2>
    <div id="guestList"></div>
  </section>
</main>

<div class="fab-area">
  <button class="btn primary" id="qrBtn">QRコードを表示</button>
</div>

<dialog id="qrDialog">
  <div class="dform">
    <h3 style="text-align:center;">受付QRコード</h3>
    <div id="qrArea"></div>
    <div class="status" id="qrUrlShow"></div>
    <div id="qrEditWrap">
      <label>フォームのURL</label>
      <input type="url" id="qrUrlInput" placeholder="https://forms.gle/xxxxx" autocomplete="off">
      <div class="actions">
        <button type="button" class="btn primary" id="qrSave">保存して表示</button>
      </div>
    </div>
    <div class="actions" id="qrChangeWrap" style="display:none; justify-content:center; gap:10px;">
      <button type="button" class="btn" id="qrChange" style="width:110px; padding:6px 0; font-size:13px; background:var(--bg); color:var(--text); border-color:#aaa;">URLを変更</button>
      <button type="button" class="btn primary" id="qrCloseBtn2" style="width:110px; padding:6px 0; font-size:13px;">閉じる</button>
    </div>
    <div class="actions" id="qrCloseWrap">
      <button type="button" class="btn primary" id="qrCloseBtn">閉じる</button>
    </div>
  </div>
</dialog>

<dialog id="memoDialog">
  <form class="dform" method="dialog" id="memoForm">
    <h3 id="memoTitle">メモ</h3>
    <label>メモ</label>
    <textarea id="memoText" rows="5" placeholder="例：車椅子席を希望、開演に遅れて来場予定"></textarea>
    <label>画像（最大5枚）</label>
    <div class="thumbs" id="memoImages"></div>
    <button type="button" class="btn" id="addImgBtn">画像を追加</button>
    <input type="file" id="imgInput" accept="image/*" multiple>
    <div class="actions">
      <button type="button" class="btn" id="memoCancel">キャンセル</button>
      <button type="submit" class="btn primary">保存する</button>
    </div>
  </form>
</dialog>

<dialog id="imgDialog">
  <div class="dform">
    <img id="imgView" alt="">
    <div class="actions"><button type="button" class="btn" id="imgClose">閉じる</button></div>
  </div>
</dialog>

<script>
let guests = []; // {id, name, furigana, seats, performanceId, source:'reserved', arrived, memo, images[]}
let walkinCounts = {}; // {performanceId: 当日受付人数（人数だけの無名カウント）}
let currentTab = "";
let memoTargetId = null;

// ---- 端末内保存（共有DBに繋がっていない場合のリロード対策）----
const LS_KEY = 'lexicon_entry_guests_v1';
let saveWarned = false;
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({guests, walkinCounts, currentTab})); saveWarned = false; }
  catch(e){
    console.error(e);
    if(!saveWarned){
      saveWarned = true;
      alert('端末の保存容量がいっぱいです。画像を減らすか、不要なデータを削除してください。');
    }
  }
}
function loadLocal(){
  try{
    const s = localStorage.getItem(LS_KEY);
    if(!s) return;
    const o = JSON.parse(s);
    guests = (o.guests || []).map(normalizeGuest);
    walkinCounts = o.walkinCounts || {};
    currentTab = o.currentTab || "";
  }catch(e){ console.error(e); }
}

// 予約人数のうち何名来たかを表す arrived を正規化する（旧データの checkedIn とも互換）
// memo は旧データに無い場合は空文字にする
function normalizeGuest(raw){
  const seats = raw.seats || 1;
  let arrived = raw.arrived;
  if(arrived === undefined || arrived === null){
    arrived = raw.checkedIn ? seats : 0;
  }
  arrived = Math.max(0, Math.min(seats, arrived));
  return {...raw, seats, arrived, memo: raw.memo || '', images: Array.isArray(raw.images) ? raw.images : []};
}

function extractSeats(text){
  const m = String(text||"").match(/(\d+)/);
  return m ? parseInt(m[1],10) : 1;
}

function performanceList(){
  const ids = [...new Set(guests.map(g=>g.performanceId))].filter(Boolean);
  ids.sort();
  return ids;
}

function render(){
  const perfs = performanceList();

  // 選択中の公演回（未選択・存在しない場合は先頭）
  if(!perfs.includes(currentTab)) currentTab = perfs[0] || "";

  // タブ
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  perfs.forEach(p=>{
    const t = document.createElement('div');
    t.className = 'tab' + (currentTab===p ? ' active':'');
    t.textContent = p;
    t.onclick = ()=>{currentTab=p; render();};
    tabsEl.appendChild(t);
  });

  const visible = guests.filter(g=>g.performanceId===currentTab);
  const walkinNum = walkinCounts[currentTab] || 0;

  const enteredSeats = visible.reduce((s,g)=>s+g.arrived,0) + walkinNum;
  const waitingSeats = visible.reduce((s,g)=>s+(g.seats-g.arrived),0);
  document.getElementById('enteredNum').textContent = enteredSeats;
  document.getElementById('waitingNum').textContent = waitingSeats;
  document.getElementById('wCountNum').textContent = walkinNum;
  document.getElementById('wDec').disabled = walkinNum<=0;

  // 一覧
  const listEl = document.getElementById('guestList');
  const sorted = [...visible].sort((a,b)=> (a.performanceId||'').localeCompare(b.performanceId||'') || ((a.arrived>=a.seats)-(b.arrived>=b.seats)));
  if(sorted.length===0){
    listEl.innerHTML = '<div class="empty">まだデータがありません。予約リストをインポートしてください。</div>';
  } else {
    listEl.innerHTML = sorted.map(g=>{
      const complete = g.arrived >= g.seats;
      return `
      <div class="guest${complete?' complete':''}">
        <div class="info">
          <div class="name">${escapeHtml(g.name)}${g.orphan?'<span class="badge">リスト外</span>':''}</div>
          <div class="sub">${escapeHtml(g.furigana||'')}${g.seats>1?`　予約${g.seats}名`:''}</div>
          <button type="button" class="memo-btn${g.memo?' has':''}" data-memo="${escapeHtml(g.id)}">${g.memo ? escapeHtml(g.memo) : (g.images.length ? '＋ メモを追加' : '＋ メモ・画像を追加')}</button>
          ${g.images.length ? `<div class="gthumbs">${g.images.map((src,i)=>`<img src="${src}" alt="" data-gid="${escapeHtml(g.id)}" data-idx="${i}">`).join('')}</div>` : ''}
        </div>
        ${g.seats>1 ? `
        <div class="stepper">
          <button type="button" data-id="${escapeHtml(g.id)}" data-delta="-1" ${g.arrived<=0?'disabled':''}>−</button>
          <div class="count"><b>${g.arrived}</b> / ${g.seats}</div>
          <button type="button" data-id="${escapeHtml(g.id)}" data-delta="1" ${g.arrived>=g.seats?'disabled':''}>＋</button>
        </div>` : `
        <label class="check"><input type="checkbox" data-id="${escapeHtml(g.id)}" ${g.arrived>=1?'checked':''}></label>`}
      </div>
    `;}).join('');
    listEl.querySelectorAll('.stepper button').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const id = e.currentTarget.dataset.id;
        const delta = parseInt(e.currentTarget.dataset.delta,10);
        const g = guests.find(x=>x.id===id);
        if(!g) return;
        setArrived(id, g.arrived + delta);
      });
    });
    listEl.querySelectorAll('.check input').forEach(box=>{
      box.addEventListener('change', e=>{
        setArrived(e.currentTarget.dataset.id, e.currentTarget.checked ? 1 : 0);
      });
    });
    listEl.querySelectorAll('.memo-btn').forEach(btn=>{
      btn.addEventListener('click', e=>openMemo(e.currentTarget.dataset.memo));
    });
    listEl.querySelectorAll('.gthumbs img').forEach(im=>{
      im.addEventListener('click', e=>{
        const g = guests.find(x=>x.id===e.currentTarget.dataset.gid);
        const src = g && g.images[parseInt(e.currentTarget.dataset.idx,10)];
        if(src) openViewer(src);
      });
    });
  }

  saveLocal();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 入場人数を更新する（0〜予約人数の範囲）
function setArrived(id, value){
  const g = guests.find(x=>x.id===id);
  if(!g) return;
  const next = Math.max(0, Math.min(g.seats, value));
  if(next === g.arrived) return;
  g.arrived = next;
  render();
}

// ---- 当日受付人数（タブごとの無名カウンター、上限なし）----
function changeWalkinCount(delta){
  if(!currentTab) return;
  const next = Math.max(0, (walkinCounts[currentTab] || 0) + delta);
  walkinCounts[currentTab] = next;
  render();
}

// ---- メモ ----
function openMemo(id){
  const g = guests.find(x=>x.id===id);
  if(!g) return;
  memoTargetId = id;
  memoDraftImages = [...g.images];
  document.getElementById('memoTitle').textContent = `メモ・画像：${g.name}`;
  document.getElementById('memoText').value = g.memo || '';
  renderMemoImages();
  document.getElementById('memoDialog').showModal();
}

function submitMemo(e){
  e.preventDefault();
  const g = guests.find(x=>x.id===memoTargetId);
  if(g){
    g.memo = document.getElementById('memoText').value.trim();
    g.images = [...memoDraftImages];
  }
  memoTargetId = null;
  memoDraftImages = [];
  document.getElementById('memoDialog').close();
  render();
}

// ---- 画像 ----
const MAX_IMAGES = 5;
let memoDraftImages = [];

// 端末の保存容量を節約するため、長辺900pxのJPEGに縮小して保存する
function readImage(file, maxSide=900, quality=0.75){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}

function renderMemoImages(){
  const el = document.getElementById('memoImages');
  el.innerHTML = memoDraftImages.map((src,i)=>
    `<div class="thumb"><img src="${src}" alt="" data-idx="${i}"><button type="button" class="rm" data-rm="${i}" aria-label="画像を削除">×</button></div>`
  ).join('');
  el.querySelectorAll('img').forEach(im=>{
    im.addEventListener('click', e=>openViewer(memoDraftImages[parseInt(e.currentTarget.dataset.idx,10)]));
  });
  el.querySelectorAll('.rm').forEach(b=>{
    b.addEventListener('click', e=>{
      memoDraftImages.splice(parseInt(e.currentTarget.dataset.rm,10), 1);
      renderMemoImages();
    });
  });
}

async function addImages(files){
  for(const f of files){
    if(memoDraftImages.length >= MAX_IMAGES){
      alert(`画像は1人につき${MAX_IMAGES}枚までです。`);
      break;
    }
    try{ memoDraftImages.push(await readImage(f)); }
    catch(err){ console.error(err); alert('画像を読み込めませんでした。'); }
  }
  renderMemoImages();
}

function openViewer(src){
  if(!src) return;
  document.getElementById('imgView').src = src;
  document.getElementById('imgDialog').showModal();
}

async function handleImport(file){
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = '読み込み中…';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const newGuests = [];
    // 列の見出しの表記ゆれに対応（Googleフォームの回答シートなど）
    const pick = (row, keys) => {
      for(const k of keys){ if(row[k]!==undefined && String(row[k]).trim()!=='') return row[k]; }
      return '';
    };
    wb.SheetNames.forEach(sheetName=>{
      if(sheetName.includes('集計')) return;
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      rows.forEach(row=>{
        const name = pick(row, ['お名前','お名前 ','名前','氏名']);
        if(!name || String(name).trim()==='') return;
        const perf = pick(row, ['回・日時','公演回','公演','回']) || sheetName;
        newGuests.push({
          name: String(name).trim(),
          furigana: String(pick(row, ['フリガナ','ふりがな'])).trim(),
          email: '',
          seats: extractSeats(pick(row, ['枚数','人数','枚数（人数）'])),
          performanceId: String(perf).trim(),
          source: 'reserved',
          arrived: 0,
        });
      });
    });
    if(newGuests.length===0){
      statusEl.textContent = 'インポートできるデータが見つかりませんでした。';
      return;
    }
    // 再インポートしても入場状況・メモ・画像が消えないよう、
    // 公演回＋名前＋フリガナが一致する既存の予約者のデータを引き継ぐ
    const keyOf = g => [g.performanceId, g.name, g.furigana].join('|');
    const oldReserved = guests.filter(g=>g.source==='reserved');
    const pool = {};
    oldReserved.forEach(g=>{ (pool[keyOf(g)] = pool[keyOf(g)] || []).push(g); });

    const used = new Set();
    const merged = newGuests.map((g,i)=>{
      const old = (pool[keyOf(g)] || []).shift();
      if(old){
        used.add(old.id);
        return normalizeGuest({...g, id: old.id, arrived: old.arrived, memo: old.memo, images: old.images});
      }
      return normalizeGuest({...g, id:'local-'+Date.now()+'-'+i});
    });

    // 新しいリストに見つからなくても、入場済み・メモ・画像のある予約者は残す
    const kept = oldReserved
      .filter(g=>!used.has(g.id) && (g.arrived>0 || g.memo || g.images.length))
      .map(g=>({...g, orphan:true}));

    guests = guests.filter(g=>g.source!=='reserved').concat(merged, kept);
    render();
    statusEl.textContent = `${newGuests.length}件の予約を取り込みました。`
      + (kept.length ? `新しいリストに無い${kept.length}件は、入場・メモ・画像の記録があるため残しています。` : '');
  }catch(err){
    console.error(err);
    statusEl.textContent = '読み込みに失敗しました。ファイル形式をご確認ください。';
  }
}

// ---- QRコード（受付フォームのURLを表示）----
const QR_KEY = 'lexicon_entry_qrurl_v1';
function loadQrUrl(){
  try{ return localStorage.getItem(QR_KEY) || ''; }catch(e){ return ''; }
}
function saveQrUrl(u){
  try{ localStorage.setItem(QR_KEY, u); }catch(e){ console.error(e); }
}
function renderQr(url){
  const area = document.getElementById('qrArea');
  area.innerHTML = '';
  document.getElementById('qrUrlShow').textContent = url ? '' : 'フォームのURLを入力して保存してください。';
  document.getElementById('qrEditWrap').style.display = url ? 'none' : '';
  document.getElementById('qrChangeWrap').style.display = url ? 'flex' : 'none';
  document.getElementById('qrCloseWrap').style.display = url ? 'none' : '';
  if(!url) return;
  new QRCode(area, {text:url, width:220, height:220, correctLevel: QRCode.CorrectLevel.M});
}
function openQr(){
  const url = loadQrUrl();
  document.getElementById('qrUrlInput').value = url;
  renderQr(url);
  document.getElementById('qrDialog').showModal();
}

function init(){
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e=>{
    if(e.target.files[0]) handleImport(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('wDec').addEventListener('click', ()=>changeWalkinCount(-1));
  document.getElementById('wInc').addEventListener('click', ()=>changeWalkinCount(1));
  document.getElementById('qrBtn').addEventListener('click', openQr);
  document.getElementById('qrSave').addEventListener('click', ()=>{
    const url = document.getElementById('qrUrlInput').value.trim();
    if(!url){ alert('URLを入力してください。'); return; }
    saveQrUrl(url);
    renderQr(url);
  });
  document.getElementById('qrChange').addEventListener('click', ()=>{
    document.getElementById('qrEditWrap').style.display = '';
    document.getElementById('qrChangeWrap').style.display = 'none';
    document.getElementById('qrCloseWrap').style.display = '';
  });
  document.getElementById('qrCloseBtn').addEventListener('click', ()=>document.getElementById('qrDialog').close());
  document.getElementById('qrCloseBtn2').addEventListener('click', ()=>document.getElementById('qrDialog').close());
  document.getElementById('memoCancel').addEventListener('click', ()=>{
    memoTargetId = null;
    memoDraftImages = [];
    document.getElementById('memoDialog').close();
  });
  document.getElementById('addImgBtn').addEventListener('click', ()=>document.getElementById('imgInput').click());
  document.getElementById('imgInput').addEventListener('change', e=>{
    const files = [...e.target.files];
    e.target.value = '';
    if(files.length) addImages(files);
  });
  document.getElementById('imgClose').addEventListener('click', ()=>document.getElementById('imgDialog').close());
  document.getElementById('memoForm').addEventListener('submit', submitMemo);

  loadLocal();
  document.getElementById('importStatus').textContent = 'データはこの端末のブラウザ内に保存されます。';
  render();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
