<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexicon 入場者管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#fff; --text:#111; --sub:#666; --line:#d9d9d9; --soft:#f5f5f5;
  --ink:#111; --ok:#1b6e3c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
main{max-width:640px; margin:0 auto; padding:12px 12px 96px;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
.btn{
  border:1px solid #aaa; background:var(--bg); color:var(--text);
  padding:9px 14px; border-radius:6px; font-size:14px; cursor:pointer;
}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn:disabled{opacity:.5;}
input[type=file]{display:none;}
.tabs{display:flex; gap:6px; overflow-x:auto; margin:14px 0 10px; padding-bottom:2px;}
.tab{
  flex:0 0 auto; padding:7px 12px; border-radius:6px; font-size:13px;
  border:1px solid var(--line); background:var(--bg); color:var(--sub); white-space:nowrap; cursor:pointer;
}
.tab.active{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.card{border:1px solid var(--line); border-radius:6px; padding:10px 12px;}
.card .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;}
.card .label{font-size:12px; color:var(--sub); margin-top:2px;}
.card.enter .num{color:var(--ok);}
section.block{border:1px solid var(--line); border-radius:6px; margin-bottom:14px; overflow:hidden;}
.block h2{font-size:13px; margin:0; padding:8px 12px; background:var(--soft); border-bottom:1px solid var(--line); color:var(--sub); font-weight:600;}
.guest{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line);}
.guest:last-child{border-bottom:none;}
.guest .info{flex:1; min-width:0;}
.guest .name{font-size:15px;}
.guest .sub{font-size:12px; color:var(--sub);}
.badge{font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--sub); margin-left:6px;}
.badge.walkin{background:var(--ink); color:#fff; border-color:var(--ink);}
.guest.complete{background:var(--soft);}
.guest.complete .name{color:var(--sub);}
.stepper{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.stepper button{
  width:32px; height:32px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:16px; line-height:1; cursor:pointer;
}
.stepper button:disabled{opacity:.3;}
.stepper .count{min-width:44px; text-align:center; font-size:14px; font-variant-numeric:tabular-nums;}
.stepper .count b{color:var(--ok);}
.check{display:flex; align-items:center; gap:8px; flex:0 0 auto; padding:6px 4px; font-size:14px; cursor:pointer;}
.check input{width:26px; height:26px; margin:0; accent-color:var(--ok); cursor:pointer;}
.empty{padding:14px 12px; color:var(--sub); font-size:13px;}
.fab-area{
  position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg); border-top:1px solid var(--line);
}
.fab-area .btn{flex:1;}
dialog{border:none; border-radius:8px; padding:0; max-width:420px; width:92vw; background:var(--bg); color:var(--text);}
dialog::backdrop{background:rgba(0,0,0,.4);}
.dform{padding:18px;}
.dform h3{margin:0 0 12px; font-size:16px;}
.dform label{display:block; font-size:12px; color:var(--sub); margin:10px 0 4px;}
.dform input, .dform select{
  width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:15px;
}
.dform .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.status{font-size:12px; color:var(--sub); text-align:center; margin-top:8px;}
</style>
</head>
<body>
<main>
  <div class="row">
    <button class="btn" id="importBtn">予約リストをインポート</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>
  <div class="status" id="importStatus"></div>

  <div class="tabs" id="tabs"></div>

  <div class="cards">
    <div class="card enter"><div class="num" id="enteredNum">0</div><div class="label">入場した人数</div></div>
    <div class="card wait"><div class="num" id="waitingNum">0</div><div class="label">未入場（予約あり）</div></div>
  </div>

  <section class="block">
    <h2>予約者一覧</h2>
    <div id="guestList"></div>
  </section>
</main>

<div class="fab-area">
  <button class="btn" id="walkinBtn">予約なしのお客様を登録</button>
  <button class="btn" id="exportBtn">当日受付リストを出力</button>
</div>

<dialog id="walkinDialog">
  <form class="dform" method="dialog" id="walkinForm">
    <h3>予約なしのお客様</h3>
    <label>お名前 *</label>
    <input type="text" id="wName" required>
    <label>ふりがな</label>
    <input type="text" id="wFurigana">
    <label>メールアドレス</label>
    <input type="email" id="wEmail">
    <label>人数</label>
    <input type="number" id="wSeats" value="1" min="1">
    <label>公演回 *</label>
    <select id="wPerf" required></select>
    <div class="actions">
      <button type="button" class="btn" id="wCancel">キャンセル</button>
      <button type="submit" class="btn primary">登録する</button>
    </div>
  </form>
</dialog>

<script>
// ▼ Firebaseコンソール →「プロジェクトの設定」→「マイアプリ(ウェブ)」の値を貼り付けてください
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

let db = null, downloads = null;

function initDb(){
  if(!window.firebase || String(firebaseConfig.apiKey).startsWith('YOUR_')) return null;
  try{
    firebase.initializeApp(firebaseConfig);
    return firebase.firestore();
  }catch(e){ console.error(e); return null; }
}
let guests = []; // {id, name, furigana, email, seats, performanceId, source, arrived}
let currentTab = "";

// ---- 端末内保存（共有DBに繋がっていない場合のリロード対策）----
const LS_KEY = 'lexicon_entry_guests_v1';
function saveLocal(){
  if(db) return; // DB接続時はDB側が正
  try{ localStorage.setItem(LS_KEY, JSON.stringify({guests, currentTab})); }
  catch(e){ console.error(e); }
}
function loadLocal(){
  try{
    const s = localStorage.getItem(LS_KEY);
    if(!s) return;
    const o = JSON.parse(s);
    guests = (o.guests || []).map(normalizeGuest);
    currentTab = o.currentTab || "";
  }catch(e){ console.error(e); }
}

// 予約人数のうち何名来たかを表す arrived を正規化する（旧データの checkedIn とも互換）
function normalizeGuest(raw){
  const seats = raw.seats || 1;
  let arrived = raw.arrived;
  if(arrived === undefined || arrived === null){
    arrived = raw.checkedIn ? seats : 0;
  }
  arrived = Math.max(0, Math.min(seats, arrived));
  return {...raw, seats, arrived};
}

function extractSeats(text){
  const m = String(text||"").match(/(\d+)/);
  return m ? parseInt(m[1],10) : 1;
}

function performanceList(){
  const ids = [...new Set(guests.map(g=>g.performanceId))].filter(Boolean);
  ids.sort();
  return ids;
}

function render(){
  const perfs = performanceList();

  // 選択中の公演回（未選択・存在しない場合は先頭）
  if(!perfs.includes(currentTab)) currentTab = perfs[0] || "";

  // タブ
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  perfs.forEach(p=>{
    const t = document.createElement('div');
    t.className = 'tab' + (currentTab===p ? ' active':'');
    t.textContent = p;
    t.onclick = ()=>{currentTab=p; render();};
    tabsEl.appendChild(t);
  });

  const visible = guests.filter(g=>g.performanceId===currentTab);

  const enteredSeats = visible.reduce((s,g)=>s+g.arrived,0);
  const waitingSeats = visible.filter(g=>g.source==='reserved').reduce((s,g)=>s+(g.seats-g.arrived),0);
  document.getElementById('enteredNum').textContent = enteredSeats;
  document.getElementById('waitingNum').textContent = waitingSeats;

  // 一覧
  const listEl = document.getElementById('guestList');
  const sorted = [...visible].sort((a,b)=> (a.performanceId||'').localeCompare(b.performanceId||'') || ((a.arrived>=a.seats)-(b.arrived>=b.seats)));
  if(sorted.length===0){
    listEl.innerHTML = '<div class="empty">まだデータがありません。予約リストをインポートしてください。</div>';
  } else {
    listEl.innerHTML = sorted.map(g=>{
      const complete = g.arrived >= g.seats;
      return `
      <div class="guest${complete?' complete':''}">
        <div class="info">
          <div class="name">${escapeHtml(g.name)}${g.source==='walkin'?'<span class="badge walkin">当日受付</span>':''}</div>
          <div class="sub">${escapeHtml(g.furigana||'')}${g.seats>1?`　予約${g.seats}名`:''}</div>
        </div>
        ${g.seats>1 ? `
        <div class="stepper">
          <button type="button" data-id="${escapeHtml(g.id)}" data-delta="-1" ${g.arrived<=0?'disabled':''}>−</button>
          <div class="count"><b>${g.arrived}</b> / ${g.seats}</div>
          <button type="button" data-id="${escapeHtml(g.id)}" data-delta="1" ${g.arrived>=g.seats?'disabled':''}>＋</button>
        </div>` : `
        <label class="check"><input type="checkbox" data-id="${escapeHtml(g.id)}" ${g.arrived>=1?'checked':''}></label>`}
      </div>
    `;}).join('');
    listEl.querySelectorAll('.stepper button').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const id = e.currentTarget.dataset.id;
        const delta = parseInt(e.currentTarget.dataset.delta,10);
        const g = guests.find(x=>x.id===id);
        if(!g) return;
        setArrived(id, g.arrived + delta);
      });
    });
    listEl.querySelectorAll('.check input').forEach(box=>{
      box.addEventListener('change', e=>{
        setArrived(e.currentTarget.dataset.id, e.currentTarget.checked ? 1 : 0);
      });
    });
  }

  // ウォークインフォームの公演回選択肢
  const sel = document.getElementById('wPerf');
  const prevVal = sel.value;
  sel.innerHTML = perfs.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  if(perfs.includes(prevVal)) sel.value = prevVal;

  saveLocal();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 入場人数を更新する（0〜予約人数の範囲）
async function setArrived(id, value){
  const g = guests.find(x=>x.id===id);
  if(!g) return;
  const next = Math.max(0, Math.min(g.seats, value));
  if(next === g.arrived) return;
  g.arrived = next; // 楽観的更新
  render();
  if(db && !String(id).startsWith('local-')){
    try{ await db.doc('guests/'+id).update({arrived: next, checkedIn: next >= g.seats}); }
    catch(e){ console.error(e); /* 失敗時は購読が正しい状態に戻す */ }
  }
}

async function handleImport(file){
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = '読み込み中…';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const newGuests = [];
    wb.SheetNames.forEach(sheetName=>{
      if(sheetName.includes('集計')) return;
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      rows.forEach(row=>{
        const name = row['お名前'] || row['お名前 '] || '';
        if(!name || String(name).trim()==='') return;
        const perf = row['回・日時'] || sheetName;
        newGuests.push({
          name: String(name).trim(),
          furigana: String(row['フリガナ']||'').trim(),
          email: '',
          seats: extractSeats(row['枚数']),
          performanceId: String(perf).trim(),
          source: 'reserved',
          arrived: 0,
        });
      });
    });
    if(newGuests.length===0){
      statusEl.textContent = 'インポートできるデータが見つかりませんでした。';
      return;
    }
    if(db){
      // 既存の予約データ（当日受付は除く）を入れ替える
      const oldReserved = guests.filter(g=>g.source==='reserved');
      for(const g of oldReserved){ await db.doc('guests/'+g.id).delete(); }
      for(const g of newGuests){ await db.collection('guests').add(g); }
    } else {
      guests = guests.filter(g=>g.source!=='reserved').concat(
        newGuests.map((g,i)=>normalizeGuest({...g, id:'local-'+Date.now()+'-'+i}))
      );
      render();
    }
    statusEl.textContent = `${newGuests.length}件の予約を取り込みました。`;
  }catch(err){
    console.error(err);
    statusEl.textContent = '読み込みに失敗しました。ファイル形式をご確認ください。';
  }
}

async function submitWalkin(e){
  e.preventDefault();
  const name = document.getElementById('wName').value.trim();
  if(!name) return;
  const seats = parseInt(document.getElementById('wSeats').value,10) || 1;
  const g = {
    name,
    furigana: document.getElementById('wFurigana').value.trim(),
    email: document.getElementById('wEmail').value.trim(),
    seats,
    performanceId: document.getElementById('wPerf').value || '未指定',
    source: 'walkin',
    arrived: seats,
  };
  if(db){
    try{ await db.collection('guests').add(g); }
    catch(err){ console.error(err); alert('登録に失敗しました'); return; }
  } else {
    guests.push(normalizeGuest({...g, id:'local-'+Date.now()}));
    render();
  }
  document.getElementById('walkinDialog').close();
  document.getElementById('walkinForm').reset();
  document.getElementById('wSeats').value = 1;
}

async function exportWalkins(){
  const walkins = guests.filter(g=>g.source==='walkin');
  if(walkins.length===0){ alert('当日受付のデータがまだありません。'); return; }
  const rows = walkins.map(g=>({
    'お名前': g.name, 'フリガナ': g.furigana, 'メールアドレス': g.email,
    '人数': g.seats, '公演回': g.performanceId,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '当日受付');
  const arrbuf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([arrbuf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(downloads){
    try{ await downloads.save({filename:'当日受付リスト.xlsx', data: blob}); }
    catch(err){ console.error(err); alert('保存できませんでした。'); }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '当日受付リスト.xlsx'; a.click();
    URL.revokeObjectURL(url);
  }
}

function subscribeGuests(){
  db.collection('guests').onSnapshot(
    snap=>{
      guests = snap.docs.map(d=>normalizeGuest({id:d.id, ...d.data()}));
      render();
    },
    err=>{
      console.error(err);
      document.getElementById('importStatus').textContent = '共有データベースに接続できません。';
    }
  );
}

async function init(){
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e=>{
    if(e.target.files[0]) handleImport(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('walkinBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('wPerf');
    if(currentTab) sel.value = currentTab;
    document.getElementById('walkinDialog').showModal();
  });
  document.getElementById('wCancel').addEventListener('click', ()=>document.getElementById('walkinDialog').close());
  document.getElementById('walkinForm').addEventListener('submit', submitWalkin);
  document.getElementById('exportBtn').addEventListener('click', exportWalkins);

  db = initDb();
  if(db){
    subscribeGuests(); // 共有DBに接続（全端末で同期）
  } else {
    loadLocal();       // 未設定時はこの端末内のみ保存
    document.getElementById('importStatus').textContent = '共有DB未設定：この端末内にのみ保存されます。';
  }
  render();
  try{ downloads = await window.claude?.use?.('downloads'); }catch(e){ /* GitHub Pagesでは未使用 */ }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
